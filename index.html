<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6558e8">
<link rel="icon" href="./icon.svg">
<link rel="manifest" href="./manifest.json">
<title>מתקדמים – Education Platform</title>
<style>
:root{font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#20263d;background:#f5f7fb;--purple:#6258df;--purple-dark:#4038a8;--muted:#6d7488;--line:#e8eaf1}*{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;background:#f5f7fb}button{font:inherit}.network{position:fixed;z-index:1000;top:10px;left:50%;transform:translateX(-50%);width:min(92%,720px);padding:10px 14px;border-radius:14px;background:#fff4cf;border:1px solid #ead381;text-align:center;font-weight:700;display:none}.home{width:min(1180px,calc(100% - 36px));margin:auto;padding:18px 0 34px}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#6e63e9,#4b42bd);color:#fff;font-weight:900;font-size:23px;box-shadow:0 8px 22px #554ccc35}.brand strong{display:block;font-size:20px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.actions{display:flex;gap:10px;align-items:center}.icon,.profile{border:1px solid var(--line);background:#fff;box-shadow:0 7px 24px #2630520b;cursor:pointer}.icon{width:44px;height:44px;border-radius:14px}.profile{height:48px;border-radius:16px;padding:4px 5px 4px 12px;display:flex;align-items:center;gap:10px}.profile-copy{text-align:right;line-height:1.1}.profile-copy b,.profile-copy small{display:block}.profile-copy small{font-size:11px;color:var(--muted);margin-top:4px}.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#ebe9ff;color:var(--purple-dark);font-weight:900;font-size:18px}.hero{position:relative;min-height:350px;border-radius:34px;padding:54px 58px;overflow:hidden;background:linear-gradient(120deg,#4d45bd,#6d62e2 55%,#8b7cf1);box-shadow:0 24px 60px #4e48b926;color:#fff}.copy{position:relative;z-index:3;max-width:570px}.eyebrow{display:inline-flex;padding:7px 12px;background:#ffffff19;border:1px solid #ffffff2b;border-radius:999px;font-size:13px;font-weight:800}.copy h1{font-size:clamp(37px,5vw,58px);line-height:1.03;margin:18px 0 15px}.copy p{font-size:17px;line-height:1.7;margin:0 0 26px;color:#f3f1ff}.cta{border:0;border-radius:16px;background:#fff;color:var(--purple-dark);padding:15px 21px;font-weight:900;cursor:pointer}.guide{position:absolute;left:1%;bottom:-16%;height:118%;max-width:47%;object-fit:contain}.badge{position:absolute;z-index:4;background:#fff;color:#20263d;padding:10px 14px;border-radius:14px;font-weight:800;font-size:13px;box-shadow:0 14px 35px #25205f33}.b1{left:31%;top:54px}.b2{left:4%;bottom:32px}.stats{display:grid;grid-template-columns:repeat(3,1fr) 1.4fr;gap:12px;margin-top:15px}.stats article{min-height:83px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px 17px;display:flex;align-items:center;gap:12px}.stat-icon{width:44px;height:44px;border-radius:14px;background:#f5f4ff;display:grid;place-items:center;font-size:22px}.stats b,.stats small{display:block}.stats b{font-size:21px}.stats small{font-size:12px;color:var(--muted);margin-top:3px}.level{display:block!important}.level-line{display:flex;justify-content:space-between}.progress{height:9px;border-radius:99px;background:#eeeff4;overflow:hidden;margin-top:12px}.progress i{height:100%;display:block;background:linear-gradient(90deg,#6a60e5,#9d8df6)}.heading{display:flex;align-items:end;justify-content:space-between;margin:34px 2px 15px}.heading span{color:var(--purple);font-weight:900;font-size:13px}.heading h2{margin:5px 0 0;font-size:29px}.heading button{border:0;background:transparent;color:var(--purple-dark);font-weight:800;cursor:pointer}.paths{display:grid;grid-template-columns:1fr 1fr;gap:18px}.path{position:relative;overflow:hidden;min-height:275px;border:0;border-radius:28px;padding:30px;text-align:right;color:#fff;cursor:pointer}.english{background:linear-gradient(135deg,#5047bd,#796ce4)}.fitness{background:linear-gradient(135deg,#08745a,#20a77f)}.path-content{position:relative;z-index:3;max-width:60%}.path-label{display:inline-block;background:#ffffff1c;border:1px solid #ffffff27;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:900}.path h3{font-size:27px;margin:16px 0 10px}.path p{line-height:1.65;color:#ffffffdc}.path img{position:absolute;left:-2%;bottom:-9%;height:108%;max-width:49%;object-fit:contain}.fitness img{height:90%;bottom:0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px}.quick button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:17px;text-align:right;display:grid;grid-template-columns:46px 1fr;column-gap:12px;cursor:pointer}.quick span{grid-row:1/3;width:46px;height:46px;border-radius:14px;background:#f6f5ff;display:grid;place-items:center;font-size:22px}.quick small{color:var(--muted);margin-top:4px}.frame-host{position:fixed;inset:0;z-index:50;background:#f4f7fb;display:none}.frame-host.show{display:block}.frame{width:100%;height:100%;border:0;background:#fff}.back{position:absolute;z-index:100;top:12px;left:14px;border:1px solid #e4e5ed;background:#fff;color:#4a43b7;border-radius:13px;padding:9px 12px;font-weight:900;box-shadow:0 7px 24px #1d274021;cursor:pointer}.loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:linear-gradient(145deg,#f1efff,#ecfbf5);z-index:200}.loading.hide{display:none}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.level{grid-column:1/-1}.paths{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}}@media(max-width:560px){.home{width:100%;padding:0 12px 24px}.topbar{height:66px}.brand span,.profile-copy{display:none}.hero{border-radius:25px;padding:31px 24px 180px;min-height:445px}.copy h1{font-size:39px}.copy p{font-size:15px}.guide{height:57%;max-width:88%;width:88%;left:5%;bottom:-4%}.b1{display:none}.b2{left:15px;bottom:15px}.stats{grid-template-columns:1fr 1fr}.stats article:nth-child(3){grid-column:1/-1}.path{padding:24px;min-height:320px}.path-content{max-width:72%}.path img{max-width:52%;height:75%;bottom:-1%;left:-7%}.fitness img{height:65%}.quick{grid-template-columns:1fr}.back{top:8px;left:8px;font-size:12px}}
</style>
</head>
<body>
<div id="network" class="network">אין כרגע חיבור לאינטרנט. השינויים יישמרו כשהחיבור יחזור.</div>
<div id="loading" class="loading"><strong>מתקדמים נטען…</strong></div>
<main id="home" class="home" hidden></main>
<section id="frameHost" class="frame-host"><button id="back" class="back">⌂ בית חדש</button><iframe id="frame" class="frame" src="./legacy.html" title="מתקדמים" allow="microphone; camera; autoplay; clipboard-write"></iframe></section>
<script>
(function(){
 const $=id=>document.getElementById(id), frame=$('frame'), host=$('frameHost'), home=$('home'), loading=$('loading');
 function read(){try{const x=JSON.parse(localStorage.getItem('mamriimState')||'null');return x&&x.profile?x:null}catch(e){return null}}
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function learned(s){if(Array.isArray(s.learned))return s.learned.length;if(s.learned&&typeof s.learned==='object')return Object.keys(s.learned).length;return Math.max(0,(Number(s.day||1)-1)*5)}
 function open(screen,action){host.classList.add('show');try{const w=frame.contentWindow;if(action&&typeof w[action]==='function')w[action]();if(typeof w.showScreen==='function')w.showScreen(screen)}catch(e){}setTimeout(()=>{try{const w=frame.contentWindow;if(action&&typeof w[action]==='function')w[action]();if(typeof w.showScreen==='function')w.showScreen(screen)}catch(e){}},500)}
 function render(){const s=read();loading.classList.add('hide');if(!s){home.hidden=true;host.classList.add('show');return}host.classList.remove('show');home.hidden=false;const p=s.profile||{},name=p.firstName||p.name||'אלוף',domains=p.domains||['english','fitness'],en=domains.includes('english'),fit=domains.includes('fitness'),level=Math.max(1,Number(s.appLevel)||1),tasks=Math.max(0,Number(s.levelTasks)||0),points=Number(s.points)||0,fp=Number(s.fitness?.points)||0,coins=Number(s.coins)||Math.floor((points+fp)/10),logs=Array.isArray(s.fitness?.logs)?s.fitness.logs.length:0,streak=Math.max(0,Number(s.streak)||0);home.innerHTML=`<header class="topbar"><div class="brand"><div class="brand-mark">מ</div><div><strong>מתקדמים</strong><span>לומדים. מתחזקים. מצליחים.</span></div></div><div class="actions"><button class="icon" data-open="settings">⚙️</button><button class="profile" data-open="settings"><span class="profile-copy"><b>${esc(name)}</b><small>רמה ${level}</small></span><span class="avatar">${esc(name).charAt(0)||'א'}</span></button></div></header><section class="hero"><div class="copy"><span class="eyebrow">המסלול האישי שלך</span><h1>שלום ${esc(name)},<br>מוכנים להתקדם?</h1><p>כל מה שצריך להיום מחכה כאן — לימוד, תרגול, כושר ופרסים.</p><button class="cta" data-open="${en?'englishHome':'fitness'}" data-action="${fit&&!en?'openFitnessHome':''}">המשך מהמקום שעצרתי ←</button></div><img class="guide" src="./assets/home-guide-cutout.png" alt="אורי"><div class="badge b1">⭐ ${tasks}/5 למשימה הבאה</div><div class="badge b2">🔥 רצף ${streak} ימים</div></section><section class="stats"><article><span class="stat-icon">🪙</span><div><b>${coins}</b><small>מטבעות</small></div></article><article><span class="stat-icon">📚</span><div><b>${learned(s)}</b><small>מילים שנלמדו</small></div></article><article><span class="stat-icon">💪</span><div><b>${logs}</b><small>אימונים הושלמו</small></div></article><article class="level"><div class="level-line"><b>רמה ${level}</b><small>${tasks} מתוך 5</small></div><div class="progress"><i style="width:${Math.min(100,tasks/5*100)}%"></i></div></article></section><div class="heading"><div><span>המסלולים שלי</span><h2>מה עושים עכשיו?</h2></div><button data-open="progress" data-action="openProgressArea">לכל ההתקדמות ←</button></div><section class="paths">${en?`<button class="path english" data-open="englishHome"><div class="path-content"><span class="path-label">אנגלית</span><h3>ממשיכים ללמוד</h3><p>מילים, אותיות, משחקים ומבחן יומי בהתאמה לרמה שלך.</p><b>כניסה למסלול ←</b></div><img src="./assets/english-guide-book-cutout.png" alt="אנגלית"></button>`:''}${fit?`<button class="path fitness" data-open="fitness" data-action="openFitnessHome"><div class="path-content"><span class="path-label">כושר</span><h3>${s.fitness?.configured?'האימון הבא מחכה לך':'בונים מסלול אישי'}</h3><p>אימונים ברורים וללא ציוד, לפי הגיל, הרמה והימים שבחרת.</p><b>כניסה למסלול ←</b></div><img src="./assets/both-fitness-cutout.png" alt="כושר"></button>`:''}</section><section class="quick"><button data-open="shop" data-action="renderShop"><span>🎁</span><b>חדר הפרסים</b><small>פרסים והישגים</small></button><button data-open="progress" data-action="openProgressArea"><span>📈</span><b>ההתקדמות שלי</b><small>כל הנתונים במקום אחד</small></button><button data-open="path"><span>🗺️</span><b>מפת המסלול</b><small>לראות מה כבר נפתח</small></button></section>`;home.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open,b.dataset.action||undefined))}
 frame.addEventListener('load',()=>{loading.classList.add('hide');if(!read())host.classList.add('show')});$('back').onclick=render;window.addEventListener('message',e=>{if(e.data?.type==='MITKADMIM_MODERN_HOME'||e.data?.type==='MITKADMIM_PROFILE_CHANGED')render()});window.addEventListener('storage',render);window.addEventListener('online',()=>{$('network').style.display='none'});window.addEventListener('offline',()=>{$('network').style.display='block'});setInterval(()=>{if(!host.classList.contains('show'))render()},1500);render();
})();
</script>
</body></html>
